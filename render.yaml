# LeadHunter Studio — Render Docker Blueprint (Web + RQ Worker + Managed Redis)
services:
  # 1. Production Web API & UI Service (Gunicorn + Flask)
  - type: web
    name: leadhunter-web
    region: oregon
    plan: starter
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: SERVICE_ROLE
        value: web
      - key: LEADHUNTER_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # UI auto-session is explicitly disabled on public Render deployments.
      # Enabling trusted-proxy UI sessions requires BOTH network-level origin isolation
      # (blocking direct *.onrender.com / container access outside the authenticating proxy)
      # AND an authenticating reverse proxy that strips client-supplied headers and injects
      # a distinct TRUSTED_AUTH_PROXY_SECRET in X-Trusted-Auth-Proxy-Secret.
      - key: UI_AUTO_SESSION
        value: "false"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_THREADS
        value: "4"
      - key: GUNICORN_TIMEOUT
        value: "60"
      - key: GUNICORN_GRACEFUL_TIMEOUT
        value: "30"
      - key: BROWSER_MAX_CONCURRENCY
        value: "1"
      - key: REQUIRE_ACTIVE_WORKER
        value: "true"
      - key: RQ_QUEUE_NAME
        value: leadhunter
      - key: JOB_TIMEOUT_SECONDS
        value: "900"
      - key: JOB_RESULT_TTL_SECONDS
        value: "3600"
      - key: JOB_FAILURE_TTL_SECONDS
        value: "3600"
      - key: JOB_MAX_RETRIES
        value: "2"
      - key: JOB_DEDUP_TTL_SECONDS
        value: "900"
      - key: WORKER_HEARTBEAT_MAX_AGE_SECONDS
        value: "120"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "30"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: RATE_LIMIT_FAIL_CLOSED
        value: "true"
      - key: REDIS_URL
        fromService:
          type: redis
          name: leadhunter-redis
          property: connectionString
      - key: LEADHUNTER_API_KEY
        sync: false
      - key: GOOGLE_PAGESPEED_API_KEY
        sync: false

  # 2. Isolated Background Worker Service (RQ + Playwright Chromium, same Docker image)
  - type: worker
    name: leadhunter-worker
    region: oregon
    plan: standard # Minimum 2 GB RAM for Playwright Chromium
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python worker.py
    envVars:
      - key: SERVICE_ROLE
        value: worker
      - key: LEADHUNTER_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: BROWSER_MAX_CONCURRENCY
        value: "1"
      - key: RQ_QUEUE_NAME
        value: leadhunter
      - key: JOB_TIMEOUT_SECONDS
        value: "900"
      - key: JOB_RESULT_TTL_SECONDS
        value: "3600"
      - key: JOB_FAILURE_TTL_SECONDS
        value: "3600"
      - key: JOB_MAX_RETRIES
        value: "2"
      - key: JOB_DEDUP_TTL_SECONDS
        value: "900"
      - key: WORKER_HEARTBEAT_MAX_AGE_SECONDS
        value: "120"
      - key: WORKER_TTL_SECONDS
        value: "120"
      - key: REDIS_URL
        fromService:
          type: redis
          name: leadhunter-redis
          property: connectionString
      - key: GOOGLE_PAGESPEED_API_KEY
        sync: false

  # 3. Managed Redis / Render Key Value Broker & Shared Rate-Limit Store
  # Note: Render accepts `type: redis` as an equivalent alias for `type: keyvalue`
  # (Valkey/Redis-compatible); retained as `redis` for Blueprint and test compatibility.
  - type: redis
    name: leadhunter-redis
    region: oregon
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
